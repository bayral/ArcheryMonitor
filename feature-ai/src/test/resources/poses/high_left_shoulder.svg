<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Posture Fautive : Épaule Gauche (Arc) trop haute -->
  <rect width="100" height="100" fill="#1a1a1a" />
  
  <g stroke="#FF3333" stroke-width="0.8" opacity="0.6">
    <line x1="42" y1="25" x2="58" y2="30" /> <!-- Épaules inclinées vers le haut à gauche -->
    <line x1="42" y1="25" x2="25" y2="25" /> <!-- Bras Arc -->
    <line x1="58" y1="30" x2="75" y2="28" /> <!-- Bras Corde -->
    <line x1="42" y1="25" x2="42" y2="60" /> <!-- Tronc -->
    <line x1="58" y1="30" x2="58" y2="60" />
  </g>

  <circle id="0" cx="50" cy="20" r="2" fill="yellow" />
  <g fill="white">
    <circle id="11" cx="42" cy="25" r="1.5" /> <!-- L_SHOULDER HAUTE -->
    <circle id="12" cx="58" cy="30" r="1.5" /> <!-- R_SHOULDER -->
    <circle id="13" cx="25" cy="25" r="1.5" />
    <circle id="14" cx="75" cy="28" r="1.5" />
    <circle id="23" cx="42" cy="60" r="1.5" />
    <circle id="24" cx="58" cy="60" r="1.5" />
  </g>
</svg>
