<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100" height="100" fill="#1a1a1a" />
  
  <!-- Squelette (Traits pour l'humain) -->
  <g stroke="#00FF00" stroke-width="0.8" opacity="0.6">
    <line x1="42" y1="30" x2="58" y2="30" /> <!-- Épaules -->
    <line x1="42" y1="30" x2="25" y2="30" /> <!-- Bras Arc -->
    <line x1="25" y1="30" x2="10" y2="30" /> 
    <line x1="58" y1="30" x2="75" y2="28" /> <!-- Bras Corde (Légèrement vers le haut) -->
    <line x1="75" y1="28" x2="65" y2="25" /> <!-- Vers l'ancrage visage -->
    <line x1="42" y1="30" x2="42" y2="60" /> <!-- Tronc -->
    <line x1="58" y1="30" x2="58" y2="60" />
    <line x1="42" y1="60" x2="58" y2="60" />
  </g>

  <!-- Face (Nose - Référence pour l'ancrage) -->
  <circle id="0" cx="50" cy="20" r="2" fill="#FFCC00" />
  
  <!-- Points Clés (Landmarks) -->
  <g fill="white">
    <circle id="11" cx="42" cy="30" r="1.5" /> <!-- L_SHOULDER -->
    <circle id="12" cx="58" cy="30" r="1.5" /> <!-- R_SHOULDER -->
    
    <circle id="13" cx="25" cy="30" r="1.5" /> <!-- L_ELBOW -->
    <circle id="15" cx="10" cy="30" r="1.5" /> <!-- L_WRIST -->
    
    <circle id="14" cx="75" cy="28" r="1.5" /> <!-- R_ELBOW -->
    <circle id="16" cx="65" cy="25" r="1.5" /> <!-- R_WRIST (Ancrage) -->
    
    <circle id="23" cx="42" cy="60" r="1.5" /> <!-- L_HIP -->
    <circle id="24" cx="58" cy="60" r="1.5" /> <!-- R_HIP -->
  </g>
</svg>
