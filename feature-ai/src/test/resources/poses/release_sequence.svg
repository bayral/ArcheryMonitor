<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#1a1a1a" />
  
  <!-- Frame 0: Archer stable et armé (Position ancrée) -->
  <g id="frame_0">
    <g stroke="#00AAFF" stroke-width="0.5" opacity="0.4">
      <line x1="40" y1="30" x2="60" y2="30" /> <!-- Épaules -->
      <line x1="40" y1="30" x2="20" y2="30" /> <!-- Bras Arc -->
      <line x1="60" y1="30" x2="80" y2="28" /> <!-- Bras Corde (Coude légèrement haut) -->
      <line x1="40" y1="30" x2="42" y2="60" />
      <line x1="60" y1="30" x2="58" y2="60" />
    </g>
    <circle id="0" cx="50" cy="20" r="2" fill="yellow" />
    <circle id="11" cx="40" cy="30" r="1.5" fill="white" />
    <circle id="12" cx="60" cy="30" r="1.5" fill="white" />
    <circle id="13" cx="20" cy="30" r="1.5" fill="white" />
    <circle id="14" cx="80" cy="28" r="1.5" fill="white" /> <!-- Coude armé -->
    <circle id="23" cx="42" cy="60" r="1.5" fill="white" />
    <circle id="24" cx="58" cy="60" r="1.5" fill="white" />
  </g>

  <!-- Frame 1: Décoche (Recul massif du coude) -->
  <g id="frame_1" visibility="hidden"> 
    <g stroke="#FF0000" stroke-width="0.5" opacity="0.4">
      <line x1="40" y1="30" x2="60" y2="30" />
      <line x1="40" y1="30" x2="20" y2="30" />
      <line x1="60" y1="30" x2="100" y2="25" /> <!-- Recul du coude -->
      <line x1="40" y1="30" x2="42" y2="60" />
      <line x1="60" y1="30" x2="58" y2="60" />
    </g>
    <circle id="0" cx="50" cy="20" r="2" fill="yellow" />
    <circle id="11" cx="40" cy="30" r="1.5" fill="white" />
    <circle id="12" cx="60" cy="30" r="1.5" fill="white" />
    <circle id="13" cx="20" cy="30" r="1.5" fill="white" />
    <circle id="14" cx="100" cy="25" r="1.5" fill="white" /> <!-- Coude après décoche -->
    <circle id="23" cx="42" cy="60" r="1.5" fill="white" />
    <circle id="24" cx="58" cy="60" r="1.5" fill="white" />
  </g>
</svg>
